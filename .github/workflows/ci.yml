name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # Active LTS (Krypton); keep in step with the Dockerfile
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm biome ci .
      - name: Typecheck
        run: pnpm tsc --noEmit
      - name: Engine tests
        run: pnpm vitest run
      - name: Build
        run: pnpm build

  image:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build & push image (arm64, matching the OCI host)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    # Vars/secrets come from the "oracle-cloud" GitHub environment:
    #   vars:    OCI_HOST, OCI_USER, OCI_SSH_PORT (optional), DEPLOY_DIR
    #   secrets: OCI_SSH_KEY
    # The registry pull uses this run's ephemeral GITHUB_TOKEN — no PAT needed.
    environment: oracle-cloud
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-oracle-cloud
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # DEPLOY_DIR may not exist on a fresh host, and scp cannot create it when
      # the parent (/opt) is root-owned — so make it first, over plain SSH.
      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        with:
          host: ${{ vars.OCI_HOST }}
          username: ${{ vars.OCI_USER }}
          port: ${{ vars.OCI_SSH_PORT || 22 }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: DEPLOY_DIR
          script: |
            set -euo pipefail
            if [ ! -d "$DEPLOY_DIR" ]; then
              mkdir -p "$DEPLOY_DIR" 2>/dev/null || {
                sudo mkdir -p "$DEPLOY_DIR"
                sudo chown "$(id -u):$(id -g)" "$DEPLOY_DIR"
              }
            fi

      # The host runs the repo's compose file, never a hand-edited copy.
      # .env is NOT shipped — it holds secrets and stays on the server.
      - name: Sync compose file to the host
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.OCI_HOST }}
          username: ${{ vars.OCI_USER }}
          port: ${{ vars.OCI_SSH_PORT || 22 }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ vars.DEPLOY_DIR }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.OCI_HOST }}
          username: ${{ vars.OCI_USER }}
          port: ${{ vars.OCI_SSH_PORT || 22 }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: APP_IMAGE,DEPLOY_DIR,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export APP_IMAGE
            docker compose pull app
            docker compose up -d --no-build app
            docker image prune -f
            docker compose ps
