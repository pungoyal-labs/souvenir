<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Souvenir">
  <!-- The Souvenir mark: a postage stamp (the unit) on card-table felt. Perforations are
       felt-colored dots punched along the stamp's edge; inside, the sun is NO burnt orange
       and the mountains YES ultramarine. Kept in sync with components/logo.tsx. -->
  <title>Souvenir</title>
  <rect width="64" height="64" rx="14" fill="#143024"/>
  <rect x="12" y="12" width="40" height="40" rx="2.5" fill="#f1eee4"/>
  <rect x="12" y="12" width="40" height="40" rx="2.5" fill="none" stroke="#143024" stroke-width="4" stroke-dasharray="0 8" stroke-linecap="round"/>
  <circle cx="40.5" cy="26.5" r="5" fill="#eda06d"/>
  <path d="M16.5 45.5 L27 30 L33.5 39 L38 33.5 L47.5 45.5 Z" fill="#9db9e8"/>
</svg>
